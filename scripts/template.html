<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveautés · Babelio</title>
<meta name="description" content="Les nouveautés de l'application Babelio, version par version.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root {
  --page:#fdfdfc; --surface:#f5f6f8; --rule:#e4e6ea; --rule-strong:#cfd3da;
  --ink:#172130; --ink-2:#4a5462; --muted:#6e7783; --fill:#ffb725;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page:#101722; --surface:#17202d; --rule:#263041; --rule-strong:#364254;
    --ink:#eef1f6; --ink-2:#bfc8d4; --muted:#8f99a7; --fill:#ffb725;
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:Lato,system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:56px 22px 90px}
.masthead{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.masthead h1{
  font-family:Literata,Georgia,serif;font-weight:600;
  font-size:clamp(30px,5vw,40px);line-height:1.1;margin:0;
}
.masthead p{margin:0;color:var(--muted);max-width:52ch}
.brand{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:700;margin-bottom:14px;
}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--fill);display:inline-block}
article{padding-top:44px;margin-top:44px;border-top:2px solid var(--rule-strong)}
article:first-of-type{border-top:none;margin-top:26px;padding-top:0}
article header{margin-bottom:22px}
article h1{
  font-family:Literata,Georgia,serif;font-weight:600;
  font-size:25px;margin:0 0 3px;line-height:1.2;
}
.meta{margin:0;color:var(--muted);font-size:14px}
article h2{
  font-family:Literata,Georgia,serif;font-weight:600;font-size:15px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted);
  margin:34px 0 4px;
}
article h3{
  font-family:Literata,Georgia,serif;font-weight:600;
  font-size:19px;margin:24px 0 8px;line-height:1.25;
}
article h2 + h3{margin-top:12px}
p{margin:0 0 14px;color:var(--ink-2);max-width:62ch}
strong{color:var(--ink)}
ul{margin:0 0 14px;padding-left:1.15em;color:var(--ink-2);max-width:62ch}
li{margin-bottom:9px}
img{
  display:block;width:100%;max-width:330px;height:auto;
  border-radius:14px;border:1px solid var(--rule);
  margin:4px 0 18px;background:var(--surface);
}
/* A landscape montage is several screens at once: it earns the full column,
   and a little more than the text, which stays at a readable measure. */
img.wide{
  max-width:none;width:calc(100% + 44px);margin-left:-22px;
  border-radius:12px;
}
@media (max-width:760px){
  img.wide{width:100%;margin-left:0}
}
footer{
  margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);
  color:var(--muted);font-size:14px;
}
footer a{color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i></i>Babelio</div>
  <div class="masthead">
    <h1>Nouveautés</h1>
    <p>Ce qui change dans l'application, version par version.</p>
  </div>
<!--RELEASES-->
  <footer>
    Une question, un souci&nbsp;? Écrivez-nous depuis
    <strong>Réglages&nbsp;› Contactez-nous</strong> dans l'application.
  </footer>
</div>
</body>
</html>
